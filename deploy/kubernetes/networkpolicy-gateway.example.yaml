# Apply in the authenticating gateway namespace after replacing every sentinel.
# The gateway Pod must expose its TLS listener with the named container port
# "https". Add only exact identity-provider egress if the gateway needs it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: profiler-gateway-boundary
  namespace: REPLACE_WITH_GATEWAY_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: REPLACE_WITH_GATEWAY_NAME
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_APPLICATION_NAMESPACE
          podSelector:
            matchLabels:
              app.kubernetes.io/name: REPLACE_WITH_APPLICATION_NAME
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_GRAFANA_NAMESPACE
          podSelector:
            matchLabels:
              app.kubernetes.io/name: REPLACE_WITH_GRAFANA_NAME
      ports:
        - protocol: TCP
          port: https
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pyroscope-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pyroscope
              app.kubernetes.io/instance: pyroscope
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - distributor
                  - query-frontend
      ports:
        - protocol: TCP
          port: 4040
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
